<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <section class="header-section">
          <h1>Job Application<strong>(Web)</strong></h1>
        </section>
        <section class="form-section">
          <form>
            <div class="form-container">
              <div class="form-top">
                <div class="form-top-left">
                  <label for="first-name">First Name</label>
                  <input
                    type="text"
                    id="first-name"
                    class="input-dim"
                    placeholder="Enter Your First Name"
                    name=""
                  />
                  <label for="email">Email</label>
                  <input
                    type="email"
                    id="email"
                    class="input-dim"
                    placeholder="abc@////.com"
                    required
                    name=""
                  />
                </div>
                <div class="form-top-right">
                  <label for="last-name">Last Name</label>
                  <input
                    type="text"
                    id="last-name"
                    class="input-dim"
                    placeholder="Enter Your Last Name"
                    name=""
                  />
                  <label for="job-role">Job Role</label>
                  <select name="" id="job-role" class="input-dim">
                    <option>I am Rich</option>
                    <option>Software Engineer</option>
                    <option>Full Stack Engineer</option>
                    <option>Frontend Engineer</option>
                    <option>Backend Engineer</option>
                  </select>
                </div>
              </div>
              <div class="form-middle">
                <label for="address">Address</label>
                <textarea name="" id="address"></textarea>
              </div>
              <div class="form-bottom">
                <div class="form-bottom-left">
                  <label for="city-name">city</label>
                  <input
                    type="text"
                    id="city-name"
                    class="input-dim"
                    placeholder=""
                    name=""
                  />
                  <label for="start-date">Start Date</label>
                  <input
                    type="datetime-local"
                    id="start-date"
                    class="input-dim"
                    placeholder=""
                    name=""
                  />
                </div>
                <div class="form-bottom-right">
                  <label for="pincode">Pincode</label>
                  <input
                    type="text"
                    id="pincode"
                    class="input-dim"
                    placeholder=""
                    name=""
                  />
                  <label for="cv">Upload Your CV</label>
                  <input type="file" class="input-dim" />
                </div>
              </div>

              <a href=""><button type="submit">Apply</button></a>
              
            </div>
          </form>
        </section>
      </div>
    </div>
  </body>
</html>
